# Commands and Apps to be executed at launch

# Wallpaper — awww daemon + Black Panther wallpaper on every login
exec-once = awww-daemon --format xrgb
exec-once = sleep 2 && awww img $HOME/Pictures/wallpapers/black-panther.jpg --transition-fps 60 --transition-type grow --transition-duration 2
